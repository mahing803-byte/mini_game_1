<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="claude:viewport-fit-sides" content="cover">

<style>

:root{

}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--chalk);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;

#app{position:relative;height:100%;max-width:760px;margin:0 auto;overflow:hidden;user-select:none;-webkit-user-select:none}
#bgc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,#000a);pointer-events:none}
.shake{animation:shake .35s}

.hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.06em;color:var(--dim);font-variant-numeric:tabular-nums;z-index:3}

.place{position:absolute;top:38px;left:0;font-family:var(--f-story);color:var(--dim);font-size:13px}

#por{position:absolute;left:50%;bottom:172px;transform:translateX(-50%);width:160px;height:200px;image-rendering:pixelated;z-index:2;filter:drop-shadow(0 8px 12px #000a)}

#box{position:absolute;left:0;right:0;bottom:16px;min-height:150px;box-sizing:border-box;background:#0b1012e6;border:1px solid #2a3538;border-radius:6px;padding:18px 20px 30px;cursor:pointer;z-index:3}

#text{font-family:var(--f-story);font-size:18px;line-height:1.7;max-width:60ch}

#text.sfx{font-family:var(--f-ui);font-size:14px;color:var(--dim);letter-spacing:.1em}
#text.sys{font-family:var(--f-ui);font-size:15px;color:var(--exit)}
#next{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--dim);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}

#choices{position:absolute;left:0;right:0;bottom:180px;max-height:calc(100% - 240px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;z-index:4}
.btn.off{opacity:.45;cursor:default}
#text.ch{font-family:var(--f-title);font-size:26px;color:var(--lamp);text-align:center;max-width:none;padding-top:22px}
.btn{font:600 16px var(--f-ui);color:var(--chalk);background:#121a1c;border:1px solid #3a4a4e;border-radius:6px;padding:14px 18px;text-align:left;cursor:pointer}

.meta{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.6}
.clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--danger);letter-spacing:.15em}

#cv{max-width:100%;max-height:calc(100% - 170px);border:1px solid #2a3538;border-radius:4px;background:#0a0f10;touch-action:none;image-rendering:pixelated}
#gcap{min-height:1.5em;font-family:var(--f-story);font-size:15px;color:#c9cfc8;text-align:center;max-width:52ch}
#pad{display:none;gap:8px;justify-content:center;flex-wrap:wrap}

@media (pointer:coarse){#pad{display:flex}.keyhint{display:none}}
.keyhint{font-size:12px;color:var(--dim)}

@media (prefers-reduced-motion:reduce){.shake,#por.ghost,#next{animation:none}.bg{transition:none}}

function present(round,k){
  const good=GOOD[round].includes(k);
  const say=round<3?(k==='none'?'……':EV[k].say):R3.find(o=>o.k===k).l;
  const lines=[['하준',say,round<3?'a':'sad']];let next;
  if(good)next=round<3?'fin'+(round+1):(flags.confess?'eT':'eT2');
  else{flags.miss=(flags.miss||0)+1;lines.push(['경비원',REBUT[round],'a']);next=flags.miss>=3?'finFail':'fin'+round}
  go({bg:'dawn',time:cur.time,lines,next});
}
function askOpts(round){
  if(round<3)return [...[...flags.ev].map(k=>({label:'제시 · '+EV[k].name,fn:()=>present(round,k)})),{label:'(내밀 게 없다)',fn:()=>present(round,'none')}];
  return R3.filter(o=>!o.req||o.req()).map(o=>({label:o.l,fn:()=>present(3,o.k)}));
}

function store(v){try{if(v===undefined)return JSON.parse(localStorage.getItem('locked7')||'[]');localStorage.setItem('locked7',JSON.stringify(v))}catch(e){return []}}
function showFound(){const f=store()||[];$('found').textContent=`찾은 엔딩 ${f.length}/3`+(f.length?' · '+f.join(', '):'')}
showFound();

let typing=null,full='',curLines=[];
function go(id){
  if(id==='END')id=score<5?'eB':!flags.trust?'eN':'fin0';
  let first=true;
  if(typeof id==='object')cur=id;
  else{cur=S[id];first=!flags.v[id];flags.v[id]=1;
    if(id==='c3a')flags.trust=1;if(id==='a3c')flags.confess=1;
    if(first&&cur.get&&!flags.ev.has(cur.get)){flags.ev.add(cur.get);toast('증거 · '+EV[cur.get].name)}
    if(cur.set)flags[cur.set]=1}
  curLines=(!first&&cur.hub)?(cur.again||[]):cur.lines;li=0;mode='talk';
  curBg=cur.bg;paintBg();$('time').textContent=cur.time;$('place').textContent=PLACE[cur.bg];
  $('choices').innerHTML='';$('box').hidden=false;$('next').hidden=false;step();
}
function step(){
  if(mode!=='talk')return;
  if(typing){clearInterval(typing);typing=null;$('text').textContent=full;return}
  if(li<curLines.length){render(curLines[li++]);return}
  if(cur.choice||cur.opts||cur.ask)return showChoices();
  if(cur.game!==undefined){mode='game';$('box').hidden=true;por.hidden=true;return startGame(cur.game,ok=>{if(ok)addClue();go(ok?cur.win:cur.lose)})}
  if(cur.ending)return showEnding();
  go(cur.next);

    while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(open(nx,ny)&&D[ny][nx]<0){D[ny][nx]=D[y][x]+1;q.push([nx,ny])}}}return D};

/* ---------- 1. 복도 순찰 피하기 (위에서 보기) ---------- */
function gStealth(){
  const W=360,H=560,L=30,R=330;
  const lockers=[[30,110],[30,250],[30,390],[298,180],[298,320],[298,460]].map(([x,y])=>({x,y,w:32,h:56,left:x<100}));
  const blocks=[{x:90,y:290,w:56,h:24},{x:236,y:170,w:56,h:24},{x:100,y:470,w:56,h:24}];
  const solids=[...lockers,...blocks];
  const p={x:180,y:530};
  const guards=[{x:200,y:90,ax:'y',min:90,max:340,v:42},{x:90,y:415,ax:'x',min:80,max:280,v:52}];
  let hid=null,near=null,lives=5,inv=1.5,left=120,flash=0,t=0;
  const collide=()=>solids.some(s=>Math.abs(p.x-(s.x+s.w/2))<7+s.w/2&&Math.abs(p.y-(s.y+s.h/2))<7+s.h/2);
  const reset=()=>{p.x=180;p.y=530;hid=null;inv=1.4};
  return{W,H,title:'복도 순찰 피하기',hint:'방향키/WASD 이동 · E 또는 스페이스로 사물함에 숨기/나오기',
   pad:[['L','←'],['U','↑'],['D','↓'],['R','→'],['E','숨기']],
   stat:()=>`남은 시간 <b>${Math.ceil(left)}</b>초 · ${hearts(lives,5)}`,
   cap:()=>hid?'숨는 중… 빛이 지나가면 다시 눌러 나오세요.':near?'사물함 앞이다. 숨기 버튼(E)을 눌러 숨기.':'',
   update(dt){
    t+=dt;left-=dt;inv-=dt;flash-=dt;
    const act=tap('E')|tap('J');
    near=null;if(!hid)for(const k of lockers){const dx=Math.max(k.x-p.x,0,p.x-(k.x+k.w)),dy=Math.max(k.y-p.y,0,p.y-(k.y+k.h));if(Math.hypot(dx,dy)<14){near=k;break}}
    if(act){if(hid){p.x=hid.left?hid.x+hid.w+9:hid.x-9;p.y=hid.y+hid.h/2;hid=null}else if(near){hid=near;p.x=near.x+near.w/2;p.y=near.y+near.h/2}}
    if(!hid){
      const s=100,mx=((keys.R|0)-(keys.L|0))*s*dt,my=((keys.D|0)-(keys.U|0))*s*dt;
      p.x+=mx;if(collide()||p.x<L+7||p.x>R-7)p.x-=mx;
      p.y+=my;if(collide()||p.y>H-8)p.y-=my;
    }
    guards.forEach((g,i)=>{g[g.ax]+=g.v*dt;if(g[g.ax]>g.max||g[g.ax]<g.min){g.v*=-1;g[g.ax]=Math.max(g.min,Math.min(g.max,g[g.ax]))}
      g.a=(g.ax==='y'?(g.v>0?Math.PI/2:-Math.PI/2):(g.v>0?0:Math.PI))+Math.sin(t*1.5+i*2)*.5});
    if(p.y<44)return{ok:true,msg:'통과!'};
    if(left<=0)return{ok:false,msg:'시간 초과'};
    if(inv<=0&&!hid)for(const g of guards){
      const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy);let da=Math.atan2(dy,dx)-g.a;da=Math.atan2(Math.sin(da),Math.cos(da));
      if(d<16||(d<115&&Math.abs(da)<.34)){lives--;flash=.4;if(!lives)return{ok:false,msg:'들켰다!'};reset();break}}
    return null;
   },
   draw(){
    ctx.fillStyle='#0b1112';ctx.fillRect(0,0,W,H);ctx.fillStyle='#141c1e';ctx.fillRect(L,0,R-L,H);
    ctx.strokeStyle='#1b2527';for(let y=0;y<H;y+=24){ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke()}
    ctx.fillStyle='#1f4a35';ctx.fillRect(L,0,R-L,40);for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#2a5c43':'#245038';ctx.fillRect(L,i*8,R-L,8)}txt('계단 ▲',180,25,'#3fbf7f');
    lockers.forEach(k=>{ctx.fillStyle=k===hid?'#3a4f4f':'#2a3a3a';ctx.fillRect(k.x,k.y,k.w,k.h);ctx.strokeStyle=k===near?'#f2c14e':'#4a5e5e';ctx.strokeRect(k.x+.5,k.y+.5,k.w-1,k.h-1);
      ctx.fillStyle='#4a5e5e';for(let i=0;i<3;i++)ctx.fillRect(k.x+6,k.y+8+i*6,k.w-12,2);ctx.fillRect(k.left?k.x+k.w-6:k.x+3,k.y+28,3,8);
      if(k===hid){ctx.fillStyle='#e9e5d8';ctx.fillRect(k.x+11,k.y+14,3,2);ctx.fillRect(k.x+18,k.y+14,3,2)}});
    blocks.forEach(b=>{ctx.fillStyle='#5a3e26';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#3e2a19';ctx.fillRect(b.x,b.y+b.h-5,b.w,5);ctx.fillRect(b.x+b.w/2-1,b.y,2,b.h)});
    guards.forEach(g=>{const gr=ctx.createRadialGradient(g.x,g.y,4,g.x,g.y,115);gr.addColorStop(0,'rgba(242,193,78,.55)');gr.addColorStop(1,'rgba(242,193,78,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.arc(g.x,g.y,115,g.a-.34,g.a+.34);ctx.closePath();ctx.fill();drawSpr(ctx,'경비원',g.x-12,g.y-16,2)});
    if(!hid){if(!(inv>0&&(inv*8|0)%2))drawSpr(ctx,'하준',p.x-12,p.y-22,2)}
    if(near&&!hid)txt('E 숨기',p.x,p.y-28,'#f2c14e',11);
    if(flash>0){ctx.fillStyle='rgba(208,86,63,.35)';ctx.fillRect(0,0,W,H)}
   }};
}

/* ---------- 2. 열쇠함 번호 ---------- */
function gLock(){
  const W=360,H=380,ans='1017';let d=[0,0,0,0],sel=0,tries=5,hist=[],shake=0,done=null;
  const wx=i=>52+i*68;
  function submit(){const g=d.join('');if(g===ans){done={ok:true,msg:'열렸다!'};beep(660,.3);return}
    let a=0;for(let i=0;i<4;i++)if(g[i]===ans[i])a++;
    let m=0;for(let n=0;n<10;n++){const c=String(n);m+=Math.min(g.split(c).length-1,ans.split(c).length-1)}
    hist.push(g+'   '+('●'.repeat(a)+'○'.repeat(m-a)||'—'));tries--;shake=.3;beep(140,.25);if(!tries)done={ok:false,msg:'경보 작동!'}}
  return{W,H,title:'교무실 열쇠함',hint:'←→ 자리 · ↑↓ 숫자 · 스페이스 확인 (숫자 위/아래 클릭도 가능)',
   pad:[['L','←'],['U','↑'],['D','↓'],['R','→'],['J','확인']],
   stat:()=>`남은 기회 ${hearts(tries,5)}`,cap:()=>'메모: 비밀번호는 「그날」 (월·일 네 자리)',
   click(x,y){for(let i=0;i<4;i++)if(x>wx(i)&&x<wx(i)+52&&y>70&&y<200){sel=i;d[i]=(d[i]+(y<135?1:9))%10;beep(500,.06)}
     if(inR(x,y,[110,220,140,40]))submit()},
   update(dt){if(done)return done;shake-=dt;
    if(tap('L'))sel=(sel+3)%4;if(tap('R'))sel=(sel+1)%4;
    if(tap('U')){d[sel]=(d[sel]+1)%10;beep(500,.06)}if(tap('D')){d[sel]=(d[sel]+9)%10;beep(500,.06)}
    if(tap('J'))submit();return null},
   draw(){const sx=shake>0?Math.sin(shake*80)*4:0;
    ctx.fillStyle='#10161a';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(sx,0);
    ctx.fillStyle='#3a4448';ctx.fillRect(30,40,300,240);ctx.fillStyle='#2a3236';ctx.fillRect(40,50,280,220);
    for(let i=0;i<4;i++){const x=wx(i);ctx.fillStyle=i===sel?'#f2c14e':'#4a5458';ctx.fillRect(x-3,67,58,136);ctx.fillStyle='#14191b';ctx.fillRect(x,70,52,130);
      txt('▲',x+26,92,'#6b7a7d',12);txt(String(d[i]),x+26,148,'#e9e5d8',36);txt('▼',x+26,192,'#6b7a7d',12)}
    ctx.fillStyle='#3fbf7f';ctx.fillRect(110,220,140,40);txt('확인',180,246,'#08130d',16);ctx.restore();
    hist.forEach((h,i)=>txt(h,180,310+i*22,'#c9cfc8',15));
   }};
}

function gPick(){

  return{W,H,title:'준비실 자물쇠',hint:'스페이스 또는 화면 클릭으로 찍기',pad:[['J','찍기']],

   click:press,
   update(dt){flash-=dt;good-=dt;pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}

/* ---------- 4. 피아노 기억 게임 ---------- */
function gPiano(){
  const W=400,H=240,notes=[262,294,330,349,392],names=['도','레','미','파','솔'],lens=[3,3,4];
  let round=0,seq=[],phase='wait',idx=0,timer=1,lit=-1,litT=0,lives=3,wrong=0,done=null;
  const newRound=()=>{seq=Array.from({length:lens[round]},()=>Math.random()*5|0);phase='show';idx=0;timer=.6};
  const light=i=>{lit=i;litT=.35;beep(notes[i])};
  const press=i=>{if(phase!=='input'||done)return;light(i);
    if(seq[idx]===i){idx++;if(idx===seq.length){round++;if(round===3)done={ok:true,msg:'완벽해!'};else{phase='wait';timer=1}}}
    else{lives--;wrong=.4;if(!lives)done={ok:false,msg:'틀렸다…'};else{phase='show';idx=0;timer=1.2}}};
  const kx=i=>18+i*74;
  return{W,H,title:'음악실 피아노',hint:'숫자 1~5 또는 건반 클릭',pad:names.map((n,i)=>[String(i+1),n]),
   stat:()=>`라운드 <b>${Math.min(round+1,3)}</b>/3 · ${hearts(lives,3)}`,
   cap:()=>phase==='input'?`따라 치세요 (${idx}/${seq.length})`:'잘 들어 보세요…',
   click(x,y){for(let i=0;i<5;i++)if(x>kx(i)&&x<kx(i)+68&&y>50&&y<210)press(i)},
   update(dt){litT-=dt;wrong-=dt;if(done)return done;
    if(phase==='wait'){timer-=dt;if(timer<=0)newRound()}
    else if(phase==='show'){timer-=dt;if(timer<=0){if(idx<seq.length){light(seq[idx++]);timer=.75}else{phase='input';idx=0}}}
    else for(let k=1;k<=5;k++)if(tap(String(k)))press(k-1);
    return null},
   draw(){ctx.fillStyle='#1a1520';ctx.fillRect(0,0,W,H);ctx.fillStyle='#2b1d1a';ctx.fillRect(10,40,380,180);
    for(let i=0;i<5;i++){ctx.fillStyle=litT>0&&lit===i?'#f2c14e':'#e9e5d8';ctx.fillRect(kx(i),50,68,160);ctx.fillStyle='#b8b3a6';ctx.fillRect(kx(i),200,68,10);txt(names[i],kx(i)+34,190,'#2c2a24',14)}
    if(wrong>0){ctx.fillStyle='rgba(208,86,63,.35)';ctx.fillRect(0,0,W,H)}
   }};
}

/* ---------- 5. 무너진 비상계단 (옆에서 보기) ---------- */
function gStairs(){
  const W=480,H=300,LW=2420,CPS=[830,1710];
  const plats=[[0,250,220,50],[280,222,90,14],[430,200,80,14,'s'],[570,172,80,14],[700,192,70,14,'b'],[820,230,150,70],
    [1030,205,70,14,'m'],[1200,180,70,14,'b'],[1320,210,80,14],[1450,180,70,14,'s'],[1580,150,70,14],[1700,190,160,110],
    [1920,170,60,14,'b'],[2040,200,70,14,'s'],[2170,170,60,14,'b'],[2290,240,130,60]].map(([x,y,w,h,k])=>({x,y,bx:x,by:y,w,h,k,t:0,gone:0}));
  const p={x:40,y:215,vx:0,vy:0,w:18,h:30,on:null};let lives=5,t=0,cam=0,cp=-1,flash=0;
  const respawn=()=>{const x=cp<0?40:CPS[cp]+20,q=plats.find(q=>x>=q.x&&x<q.x+q.w);p.x=x;p.y=q.by-p.h;p.vy=0;p.on=null;plats.forEach(q=>{q.gone=0;q.t=0})};
  return{W,H,title:'무너진 비상계단',hint:'←→/AD 이동 · ↑/W/스페이스 점프',pad:[['L','←'],['R','→'],['J','점프']],
   stat:()=>`체크포인트 <b>${cp+1}</b>/2 · ${hearts(lives,5)}`,
   update(dt){
    t+=dt;flash-=dt;
    plats.forEach(q=>{
      if(q.k==='s'){const ny=q.by+Math.sin(t*2)*26;if(p.on===q)p.y+=ny-q.y;q.y=ny}
      if(q.k==='m'){const nx=q.bx+Math.sin(t*1.4)*60;if(p.on===q)p.x+=nx-q.x;q.x=nx}
      if(q.k==='b'&&p.on===q){q.t+=dt;if(q.t>.9){q.gone=1;p.on=null}}});
    p.vx=((keys.R|0)-(keys.L|0))*170;
    if((tap('U')|tap('J')|(keys.U&&p.on?1:0))&&p.on){p.vy=-580;p.on=null}
    const by=p.y+p.h;p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(0,Math.min(LW-p.w,p.x));
    if(p.on&&(p.x+p.w<p.on.x||p.x>p.on.x+p.on.w||p.on.gone))p.on=null;
    if(p.on){p.y=p.on.y-p.h;p.vy=0}
    else if(p.vy>=0)for(const q of plats){if(q.gone)continue;
      if(p.x+p.w>q.x&&p.x<q.x+q.w&&by<=q.y+8&&p.y+p.h>=q.y){p.y=q.y-p.h;p.vy=0;p.on=q;break}}
    CPS.forEach((c,i)=>{if(p.x>c&&cp<i)cp=i});
    if(p.y>H+40){lives--;flash=.4;if(!lives)return{ok:false,msg:'떨어졌다…'};respawn()}
    cam=Math.max(0,Math.min(LW-W,p.x-180));
    if(p.x>2340&&p.on)return{ok:true,msg:'1층 도착!'};
    return null;
   },
   draw(){
    const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#151d20');gr.addColorStop(1,'#060708');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

      if(q.k==='m'){txt('◀ ▶',q.x+q.w/2,q.y+12,'#8c9a94',9)}});

    ctx.fillStyle='#1f4a35';ctx.fillRect(2370,180,40,60);ctx.fillStyle='#3fbf7f';ctx.fillRect(2362,160,56,16);txt('비상구',2390,172,'#08130d',11);
    drawSpr(ctx,'하준',Math.round(p.x)-3,Math.round(p.y)-2,2);
